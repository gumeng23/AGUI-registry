name: Auto merge

# Maintainers opt in per PR by adding the "automerge" label. Validation must
# pass first. Repository setting "Allow auto-merge" must be enabled, otherwise
# `gh pr merge --auto` fails without merging anything.
on:
  workflow_run:
    workflows: ["Validate registry"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Find pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$number" ]; then
            sha=$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")
            number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '.[0].number // empty')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge when labeled
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          labels=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          if ! grep -qx 'automerge' <<< "$labels"; then
            echo "PR #$PR 没有 automerge 标签，跳过"
            exit 0
          fi
          gh pr merge "$PR" --auto --squash --delete-branch
